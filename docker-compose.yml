version: '3.8'

services:
  # Servizio FastAPI Sentiment Analysis
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentiment-app
    ports:
      - "8000:8000"
    volumes:
      - ./log_restapi.log:/app/log_restapi.log
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - monitoring
    restart: unless-stopped

  # Servizio Prometheus
  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monitoring
    depends_on:
      - app
    restart: unless-stopped

  # Servizio Grafana
  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - monitoring
    depends_on:
      - prometheus
    restart: unless-stopped

  # Servizio Jenkins
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./Jenkinsfile:/var/jenkins_home/Jenkinsfile:ro
      - ./app.py:/var/jenkins_home/app.py:ro
      - ./test_app.py:/var/jenkins_home/test_app.py:ro
      - ./requirements.txt:/var/jenkins_home/requirements.txt:ro
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  jenkins_data:
